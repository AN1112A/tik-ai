<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tikkurila KB Demo</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 2rem; }
    code, pre { background: #f5f7f9; border-radius: 8px; padding: .5rem .75rem; display: inline-block; }
    .ok { color: #0a7f2e; }
    .err { color: #b00020; }
  </style>
</head>
<body>
  <h1>KB wired up ✅</h1>
  <p>This sample loads <code>/kb/v1/index.json</code> and product chunks from the same origin.</p>

  <pre id="out">Loading…</pre>

  <script type="module">
    import { KB } from "../src/kb-loader.mjs";
    // Change this to your Pages/jsDelivr base, e.g.:
    // const baseUrl = "https://<org>.github.io/<repo>";
    const baseUrl = location.origin + location.pathname.replace(/\/demo\/?$/, '');

    const out = document.getElementById('out');
    const kb = new KB(baseUrl);

    try {
      const idx = await kb.loadIndex();
      const products = await kb.loadAllProducts();
      const rules = await kb.getRules();
      const faqs = await kb.getFaqs();
      const fb = await kb.getFallback();
      out.textContent = JSON.stringify({
        index: idx,
        productCount: products.length,
        rules,
        faqsCount: faqs.faqs?.length || 0,
        fallback: fb
      }, null, 2);
    } catch (e) {
      out.classList.add('err');
      out.textContent = String(e);
    }
  </script>
</body>
</html>
